description: |
  A free-text note on a booking, added by your team, the customer, or the
  system.
required:
  - id
  - text
  - createdAt
  - lastEditedAt
properties:
  id:
    type: string
    format: uuid
    description: ID of the note
    example: 3d0ed9eb-95d3-4e21-a389-2218adab7850
  text:
    type: string
    description: Text content of the note
    example: 'Pickup at Hotel Astoria at 09:30, drop-off at the main dock.'
  createdAt:
    type: string
    format: date-time
    description: When the note was created
    example: 2026-04-20T12:00:00+00:00
  lastEditedAt:
    type:
      - string
      - 'null'
    format: date-time
    description: When the note was last edited. Null when the note has never been edited.
    example: 2026-04-21T09:15:00+00:00
