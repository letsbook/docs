get:
  summary: List all notes
  description: |
    Retrieves a list of all notes on a booking. Notes are free-text messages
    added by your team, the customer, or the system. The response is not paginated.
  operationId: listBookingNotes
  tags:
    - Bookings
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the booking
      schema:
        type: string
        format: uuid
        example: 8d159bbe-f6bc-4ddd-8c9a-6091d7ebd278
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/Note.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyAttempts.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml

post:
  summary: Add a note
  description: |
    Add a free-text note to a booking, for example a hotel pickup address or
    special instructions for your team.
  operationId: createBookingNote
  tags:
    - Bookings
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the booking
      schema:
        type: string
        format: uuid
        example: 8d159bbe-f6bc-4ddd-8c9a-6091d7ebd278
  requestBody:
    required: true
    description: Note details.
    content:
      application/json:
        schema:
          $ref: ../components/schemas/forms/NoteCreate.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Note.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            required:
              - errors
            properties:
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  text:
                    - The text field is required.

    '429':
      $ref: ../components/responses/TooManyAttempts.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
