get:
  summary: List booking trips
  description: |
    List the trips run for a booking, including which boats were used and the
    actual on-water times. Trips are created when a booking is confirmed, one
    per booked boat. Trips are read-only through the API. The response is not
    paginated.
  operationId: listBookingTrips
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the booking
      schema:
        type: string
        format: uuid
        example: 8d159bbe-f6bc-4ddd-8c9a-6091d7ebd278
  tags:
    - Bookings
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/Trip.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyAttempts.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
