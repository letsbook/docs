booking.trip_started:
  post:
    operationId: webhookBookingTripStarted
    tags:
      - Webhook events
    summary: Trip started
    description: Triggered when a trip starts (when the boat goes on the water). Because a booking has one trip per booked boat, this event fires per trip. The payload contains the trip with the id and reference of its parent booking.
    security:
      - WebhookSignature: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required:
              - event
              - occurredOn
              - data
            properties:
              event:
                type: string
                enum:
                  - booking.trip_started
              occurredOn:
                type: string
                format: date-time
                example: 2025-11-17T18:34:11+00:00
              data:
                allOf:
                  - $ref: ../components/schemas/Trip.yaml
                  - type: object
                    required:
                      - bookingId
                      - bookingReference
                    properties:
                      status:
                        type: string
                        enum:
                          - started
                      bookingId:
                        type: string
                        format: uuid
                        example: 551ceb1c-6fbc-479b-819d-734f4044eca2
                        description: Unique identifier of the parent booking
                      bookingReference:
                        type: string
                        example: A1B2C3
                        description: Reference of the parent booking
    responses:
      '200':
        description: Webhook received successfully
