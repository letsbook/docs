get:
  summary: Retrieve a boat
  description: |
    Retrieve an individual boat by ID, including the dock the boat is
    currently placed at.
  operationId: getBoat
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the boat
      schema:
        type: string
        format: uuid
        example: 61f7c8a2-52cf-4f39-8f2a-9c1d1a2b3c4d
  tags:
    - Boats
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/BoatExtended.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyAttempts.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
