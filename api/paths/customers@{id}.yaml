get:
  summary: Retrieve a customer
  description: Retrieve a Customer object by ID.
  operationId: getCustomer
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the customer
      schema:
        type: string
        format: uuid
        example: 8d159bbe-f6bc-4ddd-8c9a-6091d7ebd278
  tags:
    - Customers
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Customer.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '429':
      $ref: ../components/responses/TooManyAttempts.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml

post:
  summary: Update a customer
  description: Update an existing customer.
  operationId: updateCustomer
  tags:
    - Customers
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the customer
      schema:
        type: string
        format: uuid
        example: 8d159bbe-f6bc-4ddd-8c9a-6091d7ebd278
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/forms/CustomerUpdate.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Customer.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/CustomerValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyAttempts.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
