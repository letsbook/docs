get:
  summary: List all webhooks
  description: Retrieves all webhooks for the current organisation. The response is not paginated.
  operationId: listWebhooks
  tags:
    - Webhooks
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../components/schemas/Webhook.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '429':
      $ref: ../components/responses/TooManyAttempts.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml

post:
  summary: Create a webhook
  description: Create a new webhook endpoint to be called when specific events happen
  operationId: createWebhook
  tags:
    - Webhooks
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/forms/WebhookCreate.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                $ref: ../components/schemas/Webhook.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '422':
      $ref: ../components/responses/WebhookValidationError.yaml
    '429':
      $ref: ../components/responses/TooManyAttempts.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
